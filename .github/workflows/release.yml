name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vsce package --no-dependencies -o claude-code-usage-${{ github.ref_name }}.vsix

      - name: Attach the VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: claude-code-usage-${{ github.ref_name }}.vsix
          generate_release_notes: true

      # Publishing is skipped automatically until VSCE_PAT is added to the
      # repository secrets, so tagging works before a publisher account exists.
      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath claude-code-usage-${{ github.ref_name }}.vsix
